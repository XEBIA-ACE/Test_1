<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type="email"] { width: 100%; padding: 0.6rem; margin-top: 0.25rem; font-size: 1rem; border: 1px solid #555; border-radius: 4px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #0b5cad; outline-offset: 2px; }
    input[aria-invalid="true"] { border: 2px solid #a4161a; }
    .error { color: #a4161a; margin-top: 0.4rem; font-size: 0.95rem; }
    .status { color: #1b6e3a; margin-top: 1rem; }
    button { margin-top: 1.5rem; padding: 0.75rem 1.25rem; font-size: 1rem; min-height: 44px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Create your account</h1>
  <form id="register-form" novalidate>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" inputmode="email"
           autocapitalize="none" spellcheck="false" required aria-required="true"
           aria-invalid="false" aria-describedby="email-error">
    <p id="email-error" class="error" role="alert" aria-live="assertive" hidden></p>

    <button type="submit">Continue</button>
    <p id="form-status" class="status" role="status"></p>
  </form>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
